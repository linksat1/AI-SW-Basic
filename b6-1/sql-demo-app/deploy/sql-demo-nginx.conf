# /etc/nginx/default.d/sql-demo.conf 로 배치되는 파일.
# 기존 nginx.conf(default server 블록)는 건드리지 않고, 이 파일 하나만 지우면
# 완전히 원상복구된다.
#
# FastAPI(uvicorn)가 127.0.0.1:8000에서 /sql-demo 프리픽스 전체(정적 파일 + API)를
# 직접 소유하므로, 여기서는 경로 재작성 없이 그대로 넘기기만 한다.
# rate limit zone은 sql-demo-ratelimit.conf(conf.d)에서 정의된다.
location /sql-demo/ {
    limit_req zone=sqldemo burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

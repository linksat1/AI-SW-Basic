# /etc/nginx/conf.d/sql-demo-ratelimit.conf 로 배치된다.
# limit_req_zone은 http{} 블록 직속 컨텍스트에서만 선언 가능해서, server{} 안쪽인
# default.d가 아니라 http{}를 include하는 conf.d에 별도로 둔다.
#
# IP당 초당 5req, burst 10까지 허용(사람이 버튼을 연달아 눌러도 충분). 이 zone은
# sql-demo-nginx.conf의 location /sql-demo/ 블록에서 limit_req로 사용한다.
# 완전한 스크래핑 방지는 아니고(느리게 순회하면 우회 가능), 스크립트로 한꺼번에
# 21개를 초 단위로 긁어가는 걸 어렵게 만드는 목적이다.
limit_req_zone $binary_remote_addr zone=sqldemo:10m rate=5r/s;
